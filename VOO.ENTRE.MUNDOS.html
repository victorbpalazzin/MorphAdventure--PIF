<style>
:root{color-scheme:dark;--bg:#10192e;--panel:rgba(10,18,38,.86);--line:rgba(255,255,255,.15);--accent:#ffe58f;--ink:#f7fbff}
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at top,#273c68,#0d1324 75%);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
.shell{width:min(1110px,100%)}header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}h1{margin:0;font-size:clamp(23px,3vw,34px);letter-spacing:-1px}h1 span{color:#ffdd7b}.sub{font-size:12px;color:#b8c9ec}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.pill{border:1px solid var(--line);border-radius:999px;padding:8px 12px;background:#182846;font-size:13px}.pill strong{color:#ffe58f}.stage{position:relative;overflow:hidden;border:3px solid #50658b;border-radius:22px;background:#80c9f2;box-shadow:0 25px 70px #0008;touch-action:manipulation}canvas{width:100%;display:block;aspect-ratio:16/9;max-height:70dvh;object-fit:contain}.hud{position:absolute;left:14px;top:14px;display:flex;gap:7px;flex-wrap:wrap;pointer-events:none}.hud .pill{background:#07172dc9;backdrop-filter:blur(5px)}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#071124bb;backdrop-filter:blur(5px);overflow-y:auto}.overlay.hidden{display:none}.panel{width:min(680px,100%);max-height:100%;overflow-y:auto;background:linear-gradient(135deg,#1a3054,#101d36);border:2px solid #6883b7;border-radius:22px;padding:clamp(18px,3vw,30px);box-shadow:0 20px 50px #0009;text-align:center}.panel h2{font-size:clamp(23px,4vw,34px);margin:4px 0 10px}.panel p{line-height:1.5;color:#d7e6ff;margin:8px 0 16px}.button-row{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}.btn{appearance:none;border:0;border-radius:13px;background:linear-gradient(#fff0a6,#ffbd60);color:#28304d;padding:12px 19px;font-weight:850;cursor:pointer;font-size:15px;box-shadow:0 4px #af722f;transition:transform .12s}.btn:active{transform:translateY(3px);box-shadow:0 1px #af722f}.btn.secondary{background:#263f69;color:white;box-shadow:0 4px #14233c;border:1px solid #7294c7}.btn.secondary:disabled{opacity:.36;cursor:not-allowed}.btn.selected{outline:3px solid #96f5cd;background:#2d846b;color:#fff}.btn.danger{background:#af4c5d;color:#fff;box-shadow:0 4px #6d293b}.help{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px;text-align:left}.help div{background:#152642;border:1px solid var(--line);padding:11px;border-radius:12px;font-size:13px;color:#d9e8ff}footer{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:#b9cbe9;font-size:12px;padding:13px 4px}.small{font-size:13px!important;color:#adc6ef!important}.tip{color:#ffd58b!important;font-size:13px!important}.legend{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:12px 0}.legend span{font-size:12px;background:#172b4c;border-radius:9px;padding:8px}.badge{font-size:36px}.button-row{margin-top:16px}@media(max-width:620px){.help{grid-template-columns:1fr}.panel{padding:14px}.overlay{padding:8px}.pill{padding:6px 8px;font-size:11px}.stage{border-width:2px;border-radius:15px}.hud{top:7px;left:7px}.btn{padding:10px 12px;font-size:13px}footer{font-size:11px}}

.energy{padding:8px 14px;background:#07172de6;border:1px solid #ffffff30;border-radius:14px;min-width:205px}.energy>span{display:block;font-size:10px;letter-spacing:1.4px;font-weight:800;margin-bottom:5px}.battery{position:relative;width:180px;height:23px;padding:3px;border:2px solid #d8f7ff;border-radius:6px}.battery:after{content:'';position:absolute;right:-7px;top:5px;width:5px;height:9px;background:#d8f7ff;border-radius:0 3px 3px 0}#batteryFill{width:0;height:100%;border-radius:2px;background:linear-gradient(90deg,#52cbb3,#d7ff8a);transition:width .55s cubic-bezier(.2,.8,.2,1)}.battery.full{box-shadow:0 0 18px #a4ffb5;animation:charged .3s ease-in-out 4 alternate}.boosts{display:flex;gap:5px;align-items:flex-start;flex-wrap:wrap}.boosts span{background:#07172de6;border:1px solid #b2e4ff66;border-radius:10px;padding:7px;font-size:12px}.score-pop{animation:scorePop .28s ease-out}.hud{right:14px;align-items:flex-start}.hud>.pill{min-height:34px}canvas{touch-action:none}.damage-flash{position:absolute;inset:0;pointer-events:none}button:focus-visible{outline:3px solid #a5ffdb;outline-offset:4px}@keyframes charged{to{transform:scale(1.06);filter:brightness(1.5)}}@keyframes scorePop{50%{transform:scale(1.2);color:#fff}}@media(max-width:620px){body{padding:8px}.hud{right:7px;gap:4px}.energy{min-width:145px;padding:5px 9px}.battery{width:125px;height:18px}.battery:after{top:3px;height:8px}.energy>span{font-size:8px;margin-bottom:3px}.boosts span{font-size:10px;padding:4px}.hud>.pill{min-height:27px}}
/* Moldura discreta: o cenário é o protagonista. */
body{background:radial-gradient(ellipse at 50% 0,#203b4d,#0c1725 68%);padding:20px;color:#edf3e8}.shell{width:min(1200px,100%)}header{margin-bottom:18px}h1{font-family:Georgia,serif;letter-spacing:-.8px;font-weight:500}h1 span{color:#f4e6c3}.sub{font-size:9px;letter-spacing:2.8px;margin-top:7px;color:#95b6bd}.stage{border:1px solid #8aa4ad66;border-radius:16px;box-shadow:0 24px 80px #0008}canvas{max-height:none;aspect-ratio:16/9}.pill{border-color:#92aeb333;background:#1c3241;font-size:12px}.hud{top:16px;left:16px;right:62px}.hud .pill,.energy{background:#0d2639d9;backdrop-filter:blur(8px);border-color:#b8d6d333}.energy{border-radius:10px}.panel{background:linear-gradient(145deg,#1b3949f5,#102537f5);border:1px solid #94b6b477;border-radius:17px}.panel h2{font-family:Georgia,serif;font-weight:500;color:#f6e7c7}.btn{background:linear-gradient(#f2dfad,#dabd80);box-shadow:0 3px #8b7550;border-radius:9px}.btn.secondary{background:#233d4c;border-color:#88a9b044;box-shadow:none}.legend span,.help div{background:#203f4d;border-color:#82a8b222}.overlay{background:#07162499;backdrop-filter:blur(3px)}.pause-control{position:absolute;right:15px;top:16px;z-index:2;border:1px solid #bad2d544;background:#0d2639dd;color:#f4e6c3;border-radius:9px;min-height:34px;min-width:34px;cursor:pointer;font-size:16px}footer{color:#99b0b7}.battery{height:20px}.energy{padding:6px 13px}.energy>span{letter-spacing:.8px}.help{margin-top:12px}.help div{font-size:12px}.badge{display:none}
@media(max-width:620px){body{padding:9px;align-items:flex-start;padding-top:20px}header{margin-bottom:12px}.bar{gap:6px}h1{font-size:27px}.sub{font-size:8px;letter-spacing:1.5px}.hud{left:7px;top:7px;right:45px;gap:4px}.energy{padding:4px 8px;min-width:140px}.battery{height:16px;width:120px}.energy>span{font-size:8px}.pause-control{right:6px;top:7px;min-width:30px;min-height:30px}.panel h2{font-size:24px}.panel p{font-size:13px}.help{grid-template-columns:1fr}.stage{border-radius:10px}.hud>.pill{font-size:9px;padding:5px 6px}.boosts span{font-size:9px}.panel{padding:13px}.legend{gap:4px}.legend span{font-size:10px;padding:5px}footer{font-size:10px}}
@media(max-height:500px) and (orientation:landscape){body{padding:5px;align-items:center}header{margin-bottom:5px;gap:5px}h1{font-size:18px}.sub,footer{display:none}.shell{width:min(760px,calc((100dvh - 65px)*16/9))}.help{display:none}.panel{padding:10px}.panel p{font-size:12px;margin:5px}.panel h2{font-size:23px}.legend{margin:6px}.btn{padding:8px 10px;font-size:11px}.bar{gap:4px}.bar .pill{font-size:10px;padding:6px}.hud{top:7px;left:7px}.pause-control{top:7px}}

</style>

<body>
<div class="shell">
<header><div><h1><span>Voo entre Mundos</span></h1><div class="sub">UMA JORNADA ATRAVÉS DOS ELEMENTOS</div></div><div class="bar"><div class="pill" id="levelTitle">🌤️ Mundo 1/6 — Ar</div><div class="pill">⭐ Pontos: <strong id="score">0</strong></div><button class="btn secondary" id="restartTop">↻ Reiniciar</button></div></header>
<div class="stage" id="stage"><button class="pause-control" id="pauseButton" aria-label="Pausar ou continuar">Ⅱ</button><canvas id="game" width="960" height="540" aria-label="Jogo Voo entre Mundos, com obstáculos e colecionáveis"></canvas><div class="hud"><div class="pill" id="distance">🚪 Portal: 0%</div><div class="pill" id="lives">❤️❤️❤️</div><div class="energy"><span id="energyLabel">ENERGIA · 0%</span><div id="battery" class="battery" role="progressbar" aria-label="Energia do portal" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="batteryFill"></div></div></div><div class="boosts" id="boosts"></div></div>
<div class="overlay" id="overlay"><div class="panel" id="panel"></div></div></div>
<footer><div>⌨️ <strong>Espaço / ↑ / W</strong> para subir • <strong>Clique/toque</strong> na área de jogo para subir • <strong>P</strong> para pausar</div><div>Colete energia, descubra boosts e atravesse os seis mundos.</div></footer>
</div>
<script>
'use strict';
// CONFIGURAÇÕES
const W=960,H=540,END=1450,NEEDED=6;
const $=id=>document.getElementById(id),canvas=$('game'),ctx=canvas.getContext('2d'),overlay=$('overlay'),panel=$('panel');
const rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
// MUNDOS — cenários e personagens originais
const worlds=[
 {name:'Ar',emoji:'🌤️',animal:'🐦',animalName:'Passarinho',sky:['#76c6ff','#d8f1ff'],floor:'#6cb879',pipe:'#5b9b74'},
 {name:'Água',emoji:'🌊',animal:'🐠',animalName:'Peixinho',sky:['#0f75b8','#53c8da'],floor:'#317f91',pipe:'#13758b'},
 {name:'Floresta',emoji:'🌳',animal:'🦋',animalName:'Borboleta',sky:['#5ca65b','#c1de8e'],floor:'#3f7543',pipe:'#276f49'},
 {name:'Gelo',emoji:'❄️',animal:'🐧',animalName:'Pinguim',sky:['#95d9ee','#e9fdff'],floor:'#91b7d3',pipe:'#5ca0bd'},
 {name:'Terra',emoji:'🏜️',animal:'🦊',animalName:'Raposa voadora',sky:['#e8b36f','#fbe1a4'],floor:'#ba8551',pipe:'#916344'},
 {name:'Fogo',emoji:'🔥',animal:'🐉',animalName:'Dragãozinho',sky:['#632338','#e26435'],floor:'#652739',pipe:'#b44437'}
];
let level=0,score=0,mode='intro',resumeMode='play',player,obstacles=[],tokens=[],powerItems=[],particles=[];
let distance=0,spawn=0,tokenSpawn=70,boostSpawn=210,collected=new Set(),health=3,invincible=0,last=0,frames=0,gameSpeed=3.3;
let active={},portal=null,transition=null,hitFlash=0,chargeFlash=0;
function setMode(value){mode=value;overlay.classList.toggle('hidden',['play','portal','transition'].includes(value));}
function resetLevel(){
 distance=0;spawn=0;tokenSpawn=70;boostSpawn=210;obstacles=[];tokens=[];powerItems=[];particles=[];collected=new Set();invincible=0;active={};portal=null;transition=null;hitFlash=0;chargeFlash=0;
 resetEnvironment();gameSpeed=DIFFICULTY[level].speed;player={x:180,y:245,vy:0,r:23,scale:1};
 $('levelTitle').textContent=`${worlds[level].emoji} Mundo ${level+1}/6 — ${worlds[level].name}`;updateHud();
}
// PLAYER E CONTROLES
function flap(){if(mode==='play')player.vy=-6.4;}
function pause(){
 if(['play','portal','transition'].includes(mode)){resumeMode=mode;setMode('pause');panel.innerHTML='<h2>⏸️ Pausado</h2><p>Sua aventura espera por você.</p><button class="btn" id="resume">Continuar</button>';$('resume').onclick=()=>setMode(resumeMode);}
 else if(mode==='pause')setMode(resumeMode);
}
window.addEventListener('keydown',e=>{if(['Space','ArrowUp','KeyW'].includes(e.code)){if(e.target?.tagName==='BUTTON')return;e.preventDefault();if(mode==='intro'&&e.code==='Space')$('startBtn').click();else flap();}if(e.code==='KeyP'&&!e.repeat)pause();});
canvas.addEventListener('pointerdown',e=>{e.preventDefault();flap();});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&['play','portal','transition'].includes(mode))pause();last=0;});
function newRun(){level=0;score=0;health=3;resetLevel();}
function restart(){newRun();startScreen();}
$('restartTop').onclick=restart;$('pauseButton').onclick=pause;
// OBSTÁCULOS
function addObstacle(){createObstacle();}
// COLETÁVEIS — seis fragmentos únicos; itens perdidos voltam ao percurso
function safeY(x){const obstacle=obstacles.find(o=>Math.abs(o.x+o.w/2-x)<140);return obstacle?obstacle.gapY:rnd(140,370);}
function addTokens(){const id=Array.from({length:NEEDED},(_,i)=>i).find(n=>!collected.has(n)&&!tokens.some(t=>t.id===n));if(id===undefined)return;tokens.push({x:W+35,y:safeY(W+35),id,r:23,spin:0,fade:0});}
function collect(t){if(t.fade||collected.has(t.id))return;collected.add(t.id);t.fade=1;addScore(35);burst(t.x,t.y,'#fff4a5',20);if(collected.size===NEEDED){chargeFlash=35;burst(player.x,player.y,'#9bffe0',40);}updateHud();}
// POWER-UPS — registro extensível: duração em segundos; escudo por impacto
const BOOSTS={
 shield:{icon:'🛡️',label:'Escudo',duration:Infinity,color:'#8ddfff'},
 magnet:{icon:'🧲',label:'Ímã',duration:8,color:'#ffb2e0'},
 slow:{icon:'⏳',label:'Slow Motion',duration:7,color:'#bcb5ff'},
 double:{icon:'✨',label:'x2',duration:10,color:'#ffe58f'}
};
function activateBoost(type){active[type]=BOOSTS[type].duration;burst(player.x,player.y,BOOSTS[type].color,30);updateHud();}
function addBoost(){const keys=Object.keys(BOOSTS),type=keys[Math.floor(rnd(0,keys.length))];powerItems.push({x:W+80,y:safeY(W+80),r:21,type});}
function updateBoosts(dt){for(const type of Object.keys(active)){if(Number.isFinite(active[type])){active[type]-=dt/60;if(active[type]<=0)delete active[type];}}}
function moveTowardPlayer(item,dt){const dx=player.x-item.x,dy=player.y-item.y,d=Math.hypot(dx,dy);if(active.magnet&&d<210&&d>0){const step=Math.min(d,8*dt);item.x+=dx/d*step;item.y+=dy/d*step;}}
// BATERIA E HUD
function addScore(points){score+=points*(active.double?2:1);const el=$('score');el.textContent=score;el.classList.remove('score-pop');void el.offsetWidth;el.classList.add('score-pop');el.style.display='inline-block';}
function updateHud(){
 $('score').textContent=score;$('distance').textContent='🚪 Percurso: '+Math.min(100,Math.floor(distance/END*100))+'%';$('lives').textContent='❤️'.repeat(health)+'🖤'.repeat(3-health);
 const energy=Math.round(collected.size/NEEDED*100);$('energyLabel').textContent=energy===100?'PORTAL ENERGIZADO · 100%':`ENERGIA · ${collected.size}/${NEEDED} · ${energy}%`;
 $('batteryFill').style.width=energy+'%';$('battery').setAttribute('aria-valuenow',energy);$('battery').classList.toggle('full',energy===100);
 const markup=Object.entries(active).map(([key,time])=>`<span>${BOOSTS[key].icon} ${BOOSTS[key].label}${Number.isFinite(time)?' · '+Math.ceil(time)+'s':''}</span>`).join('');if($('boosts').innerHTML!==markup)$('boosts').innerHTML=markup;
}
// PARTÍCULAS
function burst(x,y,color,count){for(let i=0;i<count&&particles.length<180;i++){const angle=rnd(0,Math.PI*2),speed=rnd(.8,4);particles.push({x,y,vx:Math.cos(angle)*speed,vy:Math.sin(angle)*speed,life:1,color,r:rnd(2,5)});}}
function updateEffects(dt){particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt/35;});particles=particles.filter(p=>p.life>0);hitFlash=Math.max(0,hitFlash-dt);chargeFlash=Math.max(0,chargeFlash-dt);}
function drawParticles(){for(const p of particles){ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life,0,Math.PI*2);ctx.fill();}ctx.globalAlpha=1;}
// PORTAL — surgimento, aproximação, atração e entrada no próprio cenário
function openPortal(){if(portal)return;environment=null;hazards=[];portal={x:W-90,y:H/2,age:0,entry:0,startX:0,startY:0};setMode('portal');}
function tickPortal(dt){
 portal.age+=dt;scroll+=gameSpeed*.35*dt;distance+=gameSpeed*.35*dt;obstacles.forEach(o=>o.x-=gameSpeed*.35*dt);
 if(portal.age<65){player.y+=(H/2-player.y)*Math.min(1,.025*dt);player.vy=0;}
 else {if(!portal.entry){portal.startX=player.x;portal.startY=player.y;}portal.entry+=dt;const t=clamp(portal.entry/85,0,1),ease=t*t*(3-2*t);player.x=portal.startX+(portal.x-portal.startX)*ease;player.y=portal.startY+(portal.y-portal.startY)*ease;player.scale=1-.92*t;player.vy=-2;if(t===1){addScore(100);transition={age:0,switched:false};setMode('transition');}}
}
function drawPortal(){if(!portal)return;const radius=98*clamp(portal.age/65,0,1),angle=frames*.045;ctx.save();ctx.translate(portal.x,portal.y);ctx.scale(.72,1);const glow=ctx.createRadialGradient(0,0,0,0,0,Math.max(1,radius*1.35));glow.addColorStop(0,'#f3ffff');glow.addColorStop(.35,ART[level].layers[1]);glow.addColorStop(.7,ART[level].ink);glow.addColorStop(.8,ART[level].accent);glow.addColorStop(1,ART[level].accent+'00');ctx.fillStyle=glow;ctx.beginPath();ctx.arc(0,0,radius*1.35,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#d7fff9';ctx.lineWidth=2;ctx.beginPath();for(let i=0;i<150;i++){const a=i*.13+angle,r=radius*i/150*.8;const x=Math.cos(a)*r,y=Math.sin(a)*r;if(i)ctx.lineTo(x,y);else ctx.moveTo(x,y);}ctx.stroke();for(let i=0;i<22;i++){const a=i/22*Math.PI*2+angle,r=radius*(1.04+.08*Math.sin(angle+i));ctx.fillStyle=i%2?'#fff4a8':'#96ffeb';ctx.beginPath();ctx.arc(Math.cos(a)*r,Math.sin(a)*r,2+i%3,0,Math.PI*2);ctx.fill();}ctx.restore();}
// COLISÕES — física e dimensões preservadas
function collisionRectCircle(px,py,r,rx,ry,rw,rh){const x=clamp(px,rx,rx+rw),y=clamp(py,ry,ry+rh);return (px-x)**2+(py-y)**2<r*r;}
function damage(){if(invincible>0||mode!=='play')return;invincible=75;player.vy=-4.5;if(active.shield){delete active.shield;burst(player.x,player.y,'#8ddfff',30);updateHud();return;}health--;hitFlash=22;burst(player.x,player.y,'#ff8f97',16);updateHud();if(health<=0){setMode('lost');panel.innerHTML='<div class="badge">💔</div><h2>Mais uma tentativa?</h2><p>Suas vidas acabaram. Uma nova aventura começa no mundo Ar, com três vidas para atravessar os seis mundos.</p><button class="btn" id="retry">↻ Tentar novamente</button>';$('retry').onclick=()=>{newRun();setMode('play');};}}
// CENÁRIOS ORIGINAIS
// DIREÇÃO DE ARTE — desenho vetorial local, três planos em cache por mundo.
// As camadas se repetem sem criar objetos a cada quadro; efeitos dinâmicos têm limites fixos.
const ART=[
 {title:'Céu encantado',sub:'Nas asas do vento',sky:['#286caa','#8fd9e4','#ffe1ac'],layers:['#548dae','#6caac1','#afcfcd'],ink:'#233c68',accent:'#fff0b0'},
 {title:'Oceano profundo',sub:'Sob as marés de luz',sky:['#076e8c','#0e546f','#092f4b'],layers:['#11677b','#145469','#1b7180'],ink:'#082b44',accent:'#75ffdc'},
 {title:'Floresta encantada',sub:'Onde a luz cria raízes',sky:['#163f43','#3d7969','#b3bb72'],layers:['#2b625b','#24584d','#183e3b'],ink:'#112e32',accent:'#e3ffa3'},
 {title:'Reino congelado',sub:'Além do silêncio azul',sky:['#3a4c8d','#9fb9de','#e3edef'],layers:['#677eaf','#8caacb','#b8d6e2'],ink:'#2c436c',accent:'#b8fbff'},
 {title:'Deserto ancestral',sub:'Memórias sob a areia',sky:['#b66b75','#efac79','#ffde9e'],layers:['#b97770','#c88867','#dfaa74'],ink:'#613a42',accent:'#ffe2a1'},
 {title:'Reino vulcânico',sub:'O coração da última chama',sky:['#231c3b','#743846','#d17a50'],layers:['#573043','#4c2737','#301e32'],ink:'#201a30',accent:'#ffbb66'}
];
let sceneCache=new Map();
function poly(points,fill,stroke,width=1){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}}
function ellipse(x,y,rx,ry,fill,rotation=0){ctx.fillStyle=fill;ctx.beginPath();ctx.ellipse(x,y,rx,ry,rotation,0,Math.PI*2);ctx.fill();}
function line(points,color,width=2){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(...p):ctx.moveTo(...p));ctx.strokeStyle=color;ctx.lineWidth=width;ctx.lineCap='round';ctx.lineJoin='round';ctx.stroke();}
function glow(x,y,r,color){const g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,color);g.addColorStop(1,color.slice(0,7)+'00');ctx.fillStyle=g;ctx.fillRect(x-r,y-r,r*2,r*2);}
function gradient(top,bottom,y0=0,y1=H){const g=ctx.createLinearGradient(0,y0,0,y1);g.addColorStop(0,top);g.addColorStop(1,bottom);return g;}

 if(level===5){poly([[-16,6],[-35,18],[-27,0],[-17,-1]],'#6bb4a2','#284b54',2);ellipse(0,3,23,16,'#7bc3a8');ellipse(4,9,15,8,'#f8d99b');poly([[-12,0],[-26,-24-wing*8],[-8,-17],[2,-3]],'#df997d','#815267',2);ellipse(13,-8,14,12,'#8cd4b6');poly([[6,-17],[5,-29],[13,-18],[18,-27],[21,-16]],'#ffe6b1','#73716d',1);ellipse(25,-3,8,6,'#a4ddbb');}
 ctx.shadowBlur=0;const eyeX=level===2?3:level===5?17:level===4?12:12,eyeY=level===2?-15:level===5?-10:level===4?-5:-7;ellipse(eyeX,eyeY,3,4,'#142b42');ellipse(eyeX+1,eyeY-1,1,1.4,'#fffaf0');ctx.restore();
}
function drawPortalFrame(){if(!portal)return;const r=104*clamp(portal.age/65,0,1),a=ART[level];ctx.save();ctx.translate(portal.x,portal.y);ctx.scale(.75,1);if(level===0){puff(-r*.65,r*.6,.5,'#e3f3ee');puff(r*.55,-r*.65,.45,'#e3f3ee');}else if(level===1){for(let i=0;i<12;i++){const angle=i*Math.PI/6+frames*.015;ctx.strokeStyle='#97f9e8aa';ctx.lineWidth=2;ctx.beginPath();ctx.arc(Math.cos(angle)*r,Math.sin(angle)*r,4+i%3,0,Math.PI*2);ctx.stroke();}}else if(level===2){for(let j=0;j<2;j++){ctx.strokeStyle=j?'#92b66b':'#445642';ctx.lineWidth=j?4:12;ctx.beginPath();ctx.ellipse(0,0,r*.97,r*1.03,.15,0,Math.PI*2);ctx.stroke();}for(let i=0;i<8;i++)ellipse(Math.cos(i)*r,Math.sin(i)*r,13,6,'#9ab777',i);}else if(level===3){for(let i=0;i<10;i++){const angle=i*Math.PI/5;ctx.save();ctx.translate(Math.cos(angle)*r,Math.sin(angle)*r);ctx.rotate(angle+Math.PI/2);crystal(0,0,15,'#a8dcea');ctx.restore();}}else if(level===4){for(let i=0;i<12;i++){ctx.save();ctx.rotate(i*Math.PI/6);poly([[-16,-r-10],[16,-r-10],[14,-r+10],[-14,-r+10]],'#c19771','#6e5150',2);ctx.restore();}}else{for(let i=0;i<12;i++){const angle=i*Math.PI/6;glow(Math.cos(angle)*r,Math.sin(angle)*r,15,a.accent+'88');}}ctx.restore();}
function drawWorldTitle(){if(titleTime<=0||!['play','portal','transition'].includes(mode))return;ctx.save();ctx.globalAlpha=Math.min(1,titleTime/35,(185-titleTime)/20);ctx.textAlign='center';ctx.shadowColor='#0a182c';ctx.shadowBlur=8;ctx.fillStyle='#fff4dc';ctx.font='600 12px system-ui';ctx.fillText(`MUNDO 0${level+1} / 06`,W/2,112);ctx.font='700 30px Georgia,serif';ctx.fillText(ART[level].title,W/2,147);ctx.font='13px system-ui';ctx.fillText(ART[level].sub,W/2,170);ctx.restore();}

// MECÂNICAS AMBIENTAIS — tempo de mundo respeita slow motion e pausa.
// Perigos novos cessam com a bateria cheia; os existentes concluem seu percurso.
const DIFFICULTY=[
 {speed:3.3,gap:232,interval:116,motion:0},
 {speed:3.3,gap:216,interval:116,motion:0},
 {speed:3.55,gap:216,interval:116,motion:17},
 {speed:3.55,gap:205,interval:116,motion:20},
 {speed:3.8,gap:205,interval:116,motion:23},
 {speed:3.8,gap:205,interval:108,motion:29}
];
let scroll=0,worldTime=0,titleTime=185,eventTimer=330,environment=null,hazards=[],obstacleIndex=0;
function resetEnvironment(){scroll=0;worldTime=0;titleTime=185;eventTimer=330;environment=null;hazards=[];obstacleIndex=0;sceneCache.clear();}
function createObstacle(){const cfg=DIFFICULTY[level],previous=obstacles.at(-1),center=previous?clamp(previous.baseY+rnd(-65,65),180,340):260;obstacles.push({x:W+50,w:level===4?rnd(65,90):78,gapY:center,baseY:center,gap:cfg.gap,phase:obstacleIndex++*.85,passed:false});}
function beginEnvironment(){const types=['wind','current','branches','blizzard','sand','eruption'];environment={type:types[level],age:0,warn:100,duration:210,direction:Math.sin(worldTime)>.0?-1:1};
 // Um perigo independente por evento, colocado entre colunas e limitado a um lado da passagem.
 if([1,3,5].includes(level)){const near=obstacles.at(-1),x=near?near.x+near.w+150:W+100,y=level===1?180:level===3?90:475;hazards.push({type:level===1?'jelly':level===3?'ice':'fire',x,y,baseY:y,age:0,warn:100,r:level===5?19:17,phase:worldTime,spent:false});}
}
function updateEnvironment(travel){worldTime+=travel;scroll+=gameSpeed*travel;titleTime=Math.max(0,titleTime-travel);eventTimer-=travel;
 if(eventTimer<=0&&collected.size<NEEDED&&!environment){beginEnvironment();eventTimer=level===0?640:570;}
 if(environment){environment.age+=travel;if(environment.age>environment.warn+environment.duration)environment=null;}
 for(const o of obstacles){if(o.baseY===undefined)o.baseY=o.gapY;const amplitude=DIFFICULTY[level].motion;const ramp=clamp((W-o.x)/160,0,1);o.gapY=o.baseY+Math.sin(worldTime*.014+(o.phase||0))*amplitude*ramp;}
 for(const h of hazards){h.age+=travel;h.x-=gameSpeed*travel;if(h.age>h.warn){if(h.type==='jelly')h.y=h.baseY+Math.sin((h.age-h.warn)*.025)*34;else if(h.type==='ice')h.y+=3.5*travel;else h.y=475-Math.sin(clamp((h.age-h.warn)/140,0,1)*Math.PI)*110;}}
 hazards=hazards.filter(h=>h.x>-70&&h.y<570&&h.age<350);
}
function environmentalForce(){if(!environment||environment.age<environment.warn)return 0;const e=environment,fade=Math.sin((e.age-e.warn)/e.duration*Math.PI);return fade*([.035,.05,0,.045,.065,0][level])*e.direction;}
function collideEnvironment(){for(const h of hazards){if(h.age<h.warn||h.spent)continue;if(Math.hypot(player.x-h.x,player.y-h.y)<player.r-5+h.r){damage();h.spent=true;burst(h.x,h.y,ART[level].accent,12);}}}
function drawEnvironment(){
 const a=ART[level];if(environment){const e=environment,ready=e.age>=e.warn;ctx.save();
 if([0,1,3,4].includes(level)){ctx.globalAlpha=ready?.28:.13;for(let i=0;i<9;i++){const x=(i*130+worldTime*(level===4?2:.5))%1050-40,y=160+i%3*90;ctx.strokeStyle=a.accent;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.bezierCurveTo(x+30,y-15*e.direction,x+50,y+15*e.direction,x+80,y-20*e.direction);ctx.stroke();poly([[x+76,y-13*e.direction],[x+80,y-20*e.direction],[x+70,y-20*e.direction]],a.accent);}
 if(ready&&(level===3||level===4)){ctx.fillStyle=level===3?'#dbebff':'#eec58d';ctx.globalAlpha=.12*Math.sin((e.age-e.warn)/e.duration*Math.PI);ctx.fillRect(0,0,W,H);}}
 ctx.globalAlpha=1;ctx.fillStyle='#10283de0';ctx.beginPath();ctx.roundRect(315,461,330,30,10);ctx.fill();ctx.textAlign='center';ctx.fillStyle=a.accent;ctx.font='bold 12px system-ui';const names=['Rajada de vento','Corrente marítima','Galhos em movimento','Nevasca e gelo em queda','Redemoinho de areia','Erupção vulcânica'];ctx.fillText((ready?'':'Atenção · ')+names[level]+([0,1,3,4].includes(level)?(e.direction<0?' ↑':' ↓'):''),480,481);ctx.restore();
 if(level===4){ctx.save();ctx.globalAlpha=.25;for(let i=0;i<6;i++)ellipse(760+Math.sin(worldTime*.03+i)*10,485-i*14,10+i*6,3,a.accent);ctx.restore();}
 }
 for(const h of hazards){if(h.spent)continue;ctx.save();const warning=h.age<h.warn;
 if(warning){ctx.globalAlpha=.55+.25*Math.sin(worldTime*.15);ctx.strokeStyle=a.accent;ctx.setLineDash([5,7]);ctx.lineWidth=2;ctx.beginPath();ctx.arc(h.x,h.y,30,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);ctx.font='bold 18px system-ui';ctx.textAlign='center';ctx.fillStyle=a.accent;ctx.fillText('!',h.x,h.y-38);if(h.type==='ice'){ctx.globalAlpha=.25;line([[h.x,100],[h.x,490]],a.accent,2);}ctx.globalAlpha=.45;}
 if(h.type==='jelly'){glow(h.x,h.y,38,'#c5a5f533');ellipse(h.x,h.y,19,13,'#bcb6ee');ellipse(h.x-4,h.y-3,10,6,'#f2dbfa');for(let i=0;i<4;i++){ctx.strokeStyle='#cdbbff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(h.x-12+i*8,h.y+5);ctx.quadraticCurveTo(h.x-20+i*8+Math.sin(worldTime*.06)*6,h.y+17,h.x-10+i*8,h.y+24);ctx.stroke();}}
 if(h.type==='ice'){ctx.translate(h.x+(warning?Math.sin(worldTime*.5)*2:0),h.y);crystal(0,-14,17,'#c2f1ff',-1);}
 if(h.type==='fire'){glow(h.x,h.y,42,'#ff975c77');poly([[h.x-14,h.y+8],[h.x-9,h.y-22],[h.x,h.y-36],[h.x+16,h.y-8],[h.x+16,h.y+11]],'#e86457');ellipse(h.x,h.y,18,18,'#ffb451');ellipse(h.x+2,h.y+3,10,12,'#ffed9d');}
 ctx.restore();}
}

function drawTokens(){for(const t of tokens){ctx.save();ctx.translate(t.x,t.y);ctx.rotate(Math.sin(t.spin)*.14);ctx.globalAlpha=t.fade?Math.max(0,1-t.fade/22):1;const scale=t.fade?1+t.fade/25:1;ctx.scale(scale,scale);ctx.shadowBlur=16;ctx.shadowColor='#fff59d';ctx.fillStyle='#233d75';ctx.strokeStyle='#fff4aa';ctx.lineWidth=4;ctx.beginPath();for(let j=0;j<6;j++){const a=j*Math.PI/3,x=Math.cos(a)*t.r,y=Math.sin(a)*t.r;if(j)ctx.lineTo(x,y);else ctx.moveTo(x,y);}ctx.closePath();ctx.fill();ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='white';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='bold 24px system-ui';ctx.fillText('ϟ',0,1);ctx.restore();}}
function drawBoosts(){for(const item of powerItems){ctx.save();ctx.shadowBlur=18;ctx.shadowColor=BOOSTS[item.type].color;ctx.fillStyle='#132945';ctx.strokeStyle=BOOSTS[item.type].color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(item.x,item.y,item.r+2,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font='25px "Segoe UI Emoji",sans-serif';ctx.fillText(BOOSTS[item.type].icon,item.x,item.y);ctx.restore();}}
// TRANSIÇÕES E TELAS
function startScreen(){setMode('intro');panel.innerHTML='<div class="badge">🐦</div><h2>Voo entre Mundos</h2><p>Atravesse seis ambientes com personagens diferentes. Você tem três vidas para a aventura inteira. Reúna seis fragmentos de energia em cada mundo para interromper a chegada de obstáculos e abrir o caminho até o portal!</p><div class="legend"><span>💠 Energia</span><span>🛡️ Escudo</span><span>🧲 Ímã</span><span>⏳ Slow Motion</span><span>✨ Pontos x2</span></div><button class="btn" id="startBtn">▶ Começar aventura</button><div class="help"><div>1. Use Espaço, ↑, W, clique ou toque para subir.</div><div>2. Desvie dos obstáculos e colete energia e boosts.</div><div>3. Complete a bateria e alcance o portal. P pausa.</div></div>';$('startBtn').onclick=()=>{newRun();setMode('play');};}
function victory(){setMode('won');panel.innerHTML=`<div class="badge">🏆</div><h2>Você atravessou os seis mundos!</h2><p>Ar, Água, Floresta, Gelo, Terra e Fogo: aventura completa.</p><p>⭐ Pontuação: <strong>${score}</strong></p><button class="btn" id="again">↻ Jogar novamente</button>`;$('again').onclick=restart;}
function tickTransition(dt){transition.age+=dt;if(transition.age>=24&&!transition.switched){if(level===worlds.length-1){victory();return;}const saved=transition;level++;resetLevel();transition=saved;transition.switched=true;}if(transition.age>=55){transition=null;setMode('play');}}
// GAME LOOP — o slow motion afeta o percurso, nunca a gravidade ou o impulso
function tick(dt){
 if(!['play','portal','transition'].includes(mode))return;
 frames+=dt;updateEffects(dt);
 if(mode==='portal'){tickPortal(dt);updateHud();return;}if(mode==='transition'){tickTransition(dt);return;}
 updateBoosts(dt);invincible=Math.max(0,invincible-dt);const travel=dt*(active.slow?.55:1),speed=gameSpeed*travel;
 updateEnvironment(travel);distance+=speed;player.vy=Math.min(7.2,player.vy+(.34+environmentalForce())*dt);player.y+=player.vy*dt;if(player.y<42){player.y=42;player.vy=1;}if(player.y>H-53){player.y=H-53;damage();}if(mode!=='play')return;
 spawn-=travel;tokenSpawn-=travel;boostSpawn-=travel;
 if(spawn<=0&&collected.size<NEEDED){addObstacle();spawn=DIFFICULTY[level].interval;}if(tokenSpawn<=0&&collected.size<NEEDED){addTokens();tokenSpawn=85;}if(boostSpawn<=0){addBoost();boostSpawn=rnd(260,360);}
 for(const o of obstacles){o.x-=speed;if(!o.passed&&o.x+o.w<player.x){o.passed=true;addScore(10);}if(obstacleCollision(o))damage();if(mode!=='play')return;}
 obstacles=obstacles.filter(o=>o.x>-100);collideEnvironment();if(mode!=='play')return;
 for(const t of tokens){t.spin+=.06*dt;if(t.fade){t.fade+=dt;continue;}t.x-=speed;if(t.x>player.x+240){const near=obstacles.find(o=>Math.abs(o.x+o.w/2-t.x)<105);if(near)t.y+=(near.gapY-t.y)*Math.min(1,.08*dt);}moveTowardPlayer(t,dt);if(Math.hypot(player.x-t.x,player.y-t.y)<player.r+t.r)collect(t);}
 tokens=tokens.filter(t=>t.x>-50&&t.fade<22);
 for(const item of powerItems){item.x-=speed;if(Math.hypot(player.x-item.x,player.y-item.y)<player.r+item.r){activateBoost(item.type);item.x=-100;}}powerItems=powerItems.filter(item=>item.x>-50);
 if(distance>=END){distance=END;if(collected.size===NEEDED&&obstacles.every(o=>o.x+o.w<player.x-player.r))openPortal();}
 updateHud();
}
function draw(){ctx.clearRect(0,0,W,H);background();drawObstacles();drawTokens();drawBoosts();drawPortal();drawPortalFrame();drawEnvironment();drawPlayer();drawParticles();drawWorldTitle();if(active.slow){ctx.fillStyle='#7e70ff12';ctx.fillRect(0,0,W,H);}if(chargeFlash){ctx.fillStyle=`rgba(180,255,220,${chargeFlash/180})`;ctx.fillRect(0,0,W,H);}if(hitFlash){ctx.fillStyle=`rgba(255,55,85,${hitFlash/65})`;ctx.fillRect(0,0,W,H);}if(transition&&mode!=='won'){const alpha=transition.age<24?transition.age/24:1-(transition.age-24)/31;ctx.fillStyle=`rgba(230,255,255,${clamp(alpha,0,1)})`;ctx.fillRect(0,0,W,H);}}
function loop(t){const dt=last?Math.min((t-last)/16.667,2):1;last=t;tick(dt);draw();requestAnimationFrame(loop);}
resetLevel();startScreen();requestAnimationFrame(loop);

</script>
